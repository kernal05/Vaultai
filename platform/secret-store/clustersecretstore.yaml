# One cluster-wide store. Swapping this for the Vault or AWS provider is the only change
# needed to move to a real secrets manager.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vaultai-store
spec:
  provider:
    kubernetes:
      remoteNamespace: vault-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: vault-source
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-reader
          namespace: vault-source
