version: "3.9"

# ==========================================================
# VaultAI — isolated stack
# Network: vaultai_net (external, created once via scripts/00-bootstrap.sh)
# Nothing here shares a network, volume, or env file with any other
# project on this host (hms-*, verifychain-*, crm_prod_setup-*, etc).
#
# ACCESS: every host port binds to 127.0.0.1 ONLY — nothing here is
# reachable from the public internet. You reach it via SSH tunnel
# (see scripts/tunnel.sh) or from localhost on the server itself.
# ==========================================================

networks:
  vaultai_net:
    external: true

volumes:
  vaultai_pg_data:
    name: vaultai_pg_data
  vaultai_prometheus_data:
    name: vaultai_prometheus_data
  vaultai_grafana_data:
    name: vaultai_grafana_data

services:

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: vaultai/frontend:${IMAGE_TAG:-local}
    container_name: vaultai-frontend
    restart: unless-stopped
    networks: [vaultai_net]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    environment:
      - VITE_API_BASE_URL=${API_PUBLIC_URL:-http://localhost:8082}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: vaultai/api:${IMAGE_TAG:-local}
    container_name: vaultai-api
    restart: unless-stopped
    networks: [vaultai_net]
    ports:
      - "127.0.0.1:${API_PORT:-8082}:8000"
    environment:
      - ENV=${ENV:-staging}
      - DATABASE_URL=postgresql://vaultai:${POSTGRES_PASSWORD}@vaultai-db:5432/vaultai
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: vaultai-db
    restart: unless-stopped
    networks: [vaultai_net]
    environment:
      - POSTGRES_USER=vaultai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=vaultai
    volumes:
      - vaultai_pg_data:/var/lib/postgresql/data
    # Deliberately NOT exposed on a host port — only reachable inside vaultai_net
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
    mem_limit: 256m
    cpus: 0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultai"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Observability, scoped ONLY to vaultai_net containers ----

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: vaultai-prometheus
    restart: unless-stopped
    networks: [vaultai_net]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vaultai_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    mem_limit: 200m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: vaultai-grafana
    restart: unless-stopped
    networks: [vaultai_net]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - vaultai_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    mem_limit: 200m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
