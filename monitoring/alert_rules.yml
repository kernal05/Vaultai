groups:
  - name: vaultai-alerts
    rules:
      - alert: VaultAIAPIDown
        expr: up{job="vaultai-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "VaultAI API is down"
          description: "Prometheus has not been able to scrape vaultai-api for 1 minute."

      - alert: VaultAIHighErrorRate
        expr: |
          sum(rate(vaultai_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(vaultai_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "VaultAI API error rate above 5%"
          description: "More than 5% of requests are returning 5xx over the last 5 minutes."

      - alert: VaultAIHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(vaultai_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "VaultAI API p95 latency above 3s"
          description: "95th percentile response time has exceeded 3 seconds for 2+ minutes."
