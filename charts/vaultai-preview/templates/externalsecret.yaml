# Pulls the DB password from the ClusterSecretStore instead of generating it in Git.
# Wave -1 so the Secret exists before the Deployments that read it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultai-db-eso
  labels:
    {{- include "vp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultai-store
  target:
    name: vaultai-db-eso
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: vaultai-db-source
        property: POSTGRES_PASSWORD
