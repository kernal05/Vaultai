# Per-environment random DB password. Rendered fresh on every refresh, so the
# Application marks /data as an ignoreDifference (+ RespectIgnoreDifferences):
# the first sync creates it, later syncs never overwrite it.
# NEXT STEP (afternoon block): replace this with an ExternalSecret -> Vault/ESO.
apiVersion: v1
kind: Secret
metadata:
  name: vaultai-db
  labels:
    {{- include "vp.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ randAlphaNum 24 | b64enc | quote }}
