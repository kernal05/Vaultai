# The frontend calls /api/v1/... on its own origin but its nginx has no /api proxy.
# This per-preview gateway does the routing so the app works behind ONE port.
# FQDNs + resolver are required: nginx's resolver does not apply search domains.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-conf
  labels:
    {{- include "vp.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
      set $api_up http://api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }};
      set $web_up http://frontend.{{ .Release.Namespace }}.svc.cluster.local:80;

      location = /gateway-healthz { access_log off; return 200 "ok\n"; }

      location /api/ {
        proxy_pass $api_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
      }
      location = /healthz {
        proxy_pass $api_up;
        proxy_set_header Host $host;
      }
      location / {
        proxy_pass $web_up;
        proxy_set_header Host $host;
      }
    }
