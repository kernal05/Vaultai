# Deploys the ESO secret store. The App-of-Apps root picks this file up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kernal05/Vaultai.git
    targetRevision: main
    path: platform/secret-store
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-source
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
